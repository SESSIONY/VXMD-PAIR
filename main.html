<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="RAHMANI-XMD Official Page" />
  <title>RAHMANI-XMD</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    /* Base Settings */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', sans-serif;
      background-color: #121110; /* Nyeusi laini */
      color: #e8e2d9;
      display: flex;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem 1rem;
      line-height: 1.6;
    }

    .container {
      width: 100%;
      max-width: 500px;
      display: flex;
      flex-direction: column;
      gap: 2rem;
    }

    /* ================= SEHEMU YA PICHA INAYOZUNGUKA ================= */
    .hero-section {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
    }

    .spinning-image-container {
      position: relative;
      width: 220px;
      height: 220px;
      border-radius: 50%;
      padding: 5px;
      background: linear-gradient(135deg, #ffb800, #ff6b1a, #ffb800);
      box-shadow: 0 0 40px rgba(255, 184, 0, 0.2);
      animation: spin 15s linear infinite;
    }

    .spinning-image-container img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      display: block;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .image-control {
      margin-top: 0.5rem;
      background: #1c1a17;
      border: 1px solid rgba(255, 184, 0, 0.2);
      color: #ffb800;
      padding: 0.4rem 1rem;
      border-radius: 20px;
      font-size: 0.8rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      transition: all 0.3s ease;
    }

    .image-control:hover {
      background: #25221e;
      border-color: #ffb800;
    }

    /* ================= MAANDISHI YANAYOPITA (MARQUEE) ================= */
    .marquee-container {
      width: 100%;
      overflow: hidden;
      white-space: nowrap;
      position: relative;
      /* Mask ya upande ili maandishi yatoke kwa ulaini */
      mask-image: linear-gradient(to right, transparent, black 10%, black 90%, transparent);
      -webkit-mask-image: linear-gradient(to right, transparent, black 10%, black 90%, transparent);
    }

    .marquee-text {
      display: inline-block;
      font-family: 'Playfair Display', serif;
      font-size: 2.2rem;
      font-weight: 700;
      letter-spacing: 2px;
      /* Gradient ya rangi za picha yako: Dhahabu, Moto, Dhahabu */
      background: linear-gradient(90deg, #ffb800, #ff6b1a, #ffb800, #ff6b1a, #ffb800);
      background-size: 200% auto;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: marquee 8s linear infinite, glowPulse 2s ease-in-out infinite alternate;
    }

    /* Animation ya kusogea kwa mstari (kutoka kulia kwenda kushoto) */
    @keyframes marquee {
      0% { transform: translateX(100%); }
      100% { transform: translateX(-100%); }
    }

    /* Animation ya mwanga kupuliza (glow) */
    @keyframes glowPulse {
      0% { filter: drop-shadow(0 0 5px rgba(255, 184, 0, 0.3)); }
      100% { filter: drop-shadow(0 0 20px rgba(255, 107, 26, 0.6)); }
    }

    .subtitle {
      font-size: 0.9rem;
      color: #9e8d78;
      font-weight: 400;
      letter-spacing: 1px;
    }

    /* ================= SEHEMU YA LINKS ================= */
    .links-section {
      display: flex;
      flex-direction: column;
      gap: 0.8rem;
    }

    .link-btn {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 1rem 1.2rem;
      background: #1c1a17;
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 12px;
      text-decoration: none;
      color: #e8e2d9;
      font-weight: 500;
      font-size: 0.95rem;
      transition: all 0.3s ease;
    }

    .link-btn:hover {
      background: #25221e;
      border-color: rgba(255, 184, 0, 0.3);
      transform: translateY(-2px);
    }

    .link-btn i {
      font-size: 1.2rem;
      color: #ffb800;
      width: 24px;
      text-align: center;
    }

    /* ================= SEHEMU YA MUSIC ================= */
    .music-player {
      background: #1c1a17;
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 12px;
      padding: 1.2rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      margin-top: 0.5rem;
    }

    .track-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .track-header h4 {
      font-size: 0.95rem;
      font-weight: 600;
      color: #e8e2d9;
    }

    .track-header span {
      font-size: 0.8rem;
      color: #9e8d78;
    }

    .player-controls {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .play-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: #ffb800;
      color: #121110;
      border: none;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 1rem;
      transition: background 0.3s ease;
      flex-shrink: 0;
    }

    .play-btn:hover {
      background: #e6a700;
    }

    .progress-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }

    .progress-bar {
      width: 100%;
      height: 5px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 3px;
      cursor: pointer;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: #ffb800;
      border-radius: 3px;
      transition: width 0.1s linear;
    }

    .time-tag {
      font-size: 0.75rem;
      color: #9e8d78;
      text-align: right;
    }

    /* ================= FOOTER ================= */
    .footer {
      text-align: center;
      font-size: 0.8rem;
      color: #6b6055;
      padding-top: 1.5rem;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      margin-top: 1rem;
    }
  </style>
</head>
<body>

  <div class="container">
    
    <!-- Sehemu ya Picha Inayozunguka -->
    <div class="hero-section">
      
      <div class="spinning-image-container" id="spinningImage">
        <img src="https://files.catbox.moe/aktbgo.jpg" alt="RAHMANI-XMD" />
      </div>

      <button class="image-control" id="spinToggle">
        <i class="fas fa-pause"></i> Pause Spin
      </button>

      <!-- MAANDISHI YANAYOPITA -->
      <div class="marquee-container">
        <div class="marquee-text">RAHMANI-XMD • RAHMANI-XMD • RAHMANI-XMD</div>
      </div>

      <p class="subtitle">Official Portal</p>
    </div>

    <!-- Sehemu ya Links -->
    <div class="links-section">
      <a href="https://wa.me/255693629079" target="_blank" class="link-btn">
        <i class="fab fa-whatsapp"></i>
        <span>WhatsApp Direct</span>
      </a>
      
      <a href="https://github.com/Qartde/RAHMANI-XMD" target="_blank" class="link-btn">
        <i class="fab fa-github"></i>
        <span>GitHub Repository</span>
      </a>
      
      <a href="https://whatsapp.com/channel/0029VatokI45EjxufALmY32X" target="_blank" class="link-btn">
        <i class="fas fa-bullhorn"></i>
        <span>WhatsApp Channel</span>
      </a>
      
      <a href="https://youtube.com/@rahmanirahmani-xmd?si=o-61FNO1RUWmKOh4" target="_blank" class="link-btn">
        <i class="fab fa-youtube"></i>
        <span>YouTube Channel</span>
      </a>
    </div>

    <!-- Music Player -->
    <div class="music-player">
      <div class="track-header">
        <h4>RAHMANI-XMD ⭐</h4>
        <span>Rahmani Team</span>
      </div>
      <div class="player-controls">
        <button class="play-btn" id="playBtn"><i class="fas fa-play"></i></button>
        <div class="progress-container">
          <div class="progress-bar" id="progBar">
            <div class="progress-fill" id="progFill"></div>
          </div>
          <span class="time-tag" id="timeTag">0:00 / 0:00</span>
        </div>
      </div>
    </div>

    <!-- Footer -->
    <div class="footer">
      © 2024 RAHMANI-XMD. All rights reserved.
    </div>

  </div>

  <!-- Audio -->
  <audio id="audio1" src="https://url.bmbxmd.workers.dev/7JVHN.mp3"></audio>

  <script>
    // ---------------- PICHA INAZUNGUKA ----------------
    const spinningImage = document.getElementById('spinningImage');
    const spinToggle = document.getElementById('spinToggle');
    let isSpinning = true;

    spinToggle.addEventListener('click', () => {
      if (isSpinning) {
        spinningImage.style.animationPlayState = 'paused';
        spinToggle.innerHTML = '<i class="fas fa-play"></i> Resume Spin';
        isSpinning = false;
      } else {
        spinningImage.style.animationPlayState = 'running';
        spinToggle.innerHTML = '<i class="fas fa-pause"></i> Pause Spin';
        isSpinning = true;
      }
    });

    // ---------------- MUSIC PLAYER ----------------
    const audio = document.getElementById('audio1');
    const playBtn = document.getElementById('playBtn');
    const progFill = document.getElementById('progFill');
    const progBar = document.getElementById('progBar');
    const timeTag = document.getElementById('timeTag');

    function fmt(s) {
      if (!isFinite(s)) return '0:00';
      const m = Math.floor(s / 60);
      const sec = Math.floor(s % 60);
      return `${m}:${String(sec).padStart(2, '0')}`;
    }

    playBtn.addEventListener('click', () => {
      if (audio.paused) {
        audio.play();
        playBtn.innerHTML = '<i class="fas fa-pause"></i>';
        spinningImage.style.animationDuration = '8s'; 
      } else {
        audio.pause();
        playBtn.innerHTML = '<i class="fas fa-play"></i>';
        spinningImage.style.animationDuration = '15s';
      }
    });

    audio.addEventListener('timeupdate', () => {
      const p = (audio.currentTime / audio.duration) * 100 || 0;
      progFill.style.width = p + '%';
      timeTag.textContent = `${fmt(audio.currentTime)} / ${fmt(audio.duration)}`;
    });

    audio.addEventListener('ended', () => {
      playBtn.innerHTML = '<i class="fas fa-play"></i>';
      progFill.style.width = '0%';
      timeTag.textContent = '0:00 / 0:00';
    });

    audio.addEventListener('loadedmetadata', () => {
      timeTag.textContent = `0:00 / ${fmt(audio.duration)}`;
    });

    progBar.addEventListener('click', (e) => {
      const rect = progBar.getBoundingClientRect();
      const ratio = (e.clientX - rect.left) / rect.width;
      if (audio.duration) audio.currentTime = ratio * audio.duration;
    });
  </script>
</body>
</html>
